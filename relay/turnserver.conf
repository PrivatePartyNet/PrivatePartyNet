# coturn for PrivatePartyNet: voice and screens between members whose routers let nothing through.
# The setup script (or docker-compose) adds three lines to its own copy: static-auth-secret, external-ip and
# allowed-peer-ip. The secret is the same relay secret that ppn_relay.py uses; the owner's PC turns it into short-lived
# credentials for each member (TURN REST, use-auth-secret), so no member ever holds the secret itself. Media through
# TURN stays encrypted end to end (DTLS-SRTP).

listening-port=3478
fingerprint
use-auth-secret
realm=privatepartynet

# The ports relayed media uses. Keep in step with the firewall rules in setup-ubuntu.sh and docker-compose.yml.
min-port=49160
max-port=49200

# Limits: sessions per member and in all, and bytes a second for one session (about 8 Mbit/s: a 1080p screen fits).
user-quota=12
total-quota=120
max-bps=1000000
stale-nonce=600

# A browser needs a certificate from a public authority for TURN over TLS, which a bare VPS does not have; plain
# TURN over UDP and TCP is what the app hands out.
no-tls
no-dtls
no-cli
no-multicast-peers

# Nothing relayed may reach the VPS itself or a private network behind it.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

simple-log
log-file=stdout
