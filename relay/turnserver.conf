# coturn for PrivatePartyNet: voice and screens between members whose routers let nothing through.
# The setup script (or docker-compose) adds three lines to its own copy: static-auth-secret, external-ip and
# allowed-peer-ip. The secret is the same relay secret that ppn_relay.py uses; the owner's PC turns it into short-lived
# credentials for each member (TURN REST, use-auth-secret), so no member ever holds the secret itself. Media through
# TURN stays encrypted end to end (DTLS-SRTP).

listening-port=3478
fingerprint
use-auth-secret
realm=privatepartynet

# The ports relayed media uses. Keep in step with the firewall rules in setup-ubuntu.sh and docker-compose.yml.
min-port=49160
max-port=49400

# Limits: sessions per member and in all, and bytes a second for one session (about 8 Mbit/s: a 1080p screen fits).
user-quota=12
total-quota=120
max-bps=1000000
stale-nonce=600

# A browser needs a certificate from a public authority for TURN over TLS, which a bare VPS does not have; plain
# TURN over UDP and TCP is what the app hands out.
no-tls
no-dtls
no-cli
no-multicast-peers
# Browsers relay media over UDP; TURN's TCP relaying would let a member open connections from the VPS to anywhere.
no-tcp-relay
# Nothing a stranger can use to study the server or its NAT behaviour.
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
no-software-attribute

# Nothing relayed may reach a private, reserved or special network, or the VPS's own loopback. The VPS's public address
# is allowed again by the installer (allowed-peer-ip), only so two members who both relay through it can meet; UDP only.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::-::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

simple-log
log-file=stdout
