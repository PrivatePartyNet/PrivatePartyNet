# The relay and coturn on one VPS. From this folder:
#   cp env.example .env      then put the VPS's public address in .env
#   put the relay secret alone in a file named "secret" here (README.md says how to make one)
#   docker compose up -d --build
# The relay listens on UDP 3479 and TCP 443; coturn on UDP and TCP 3478, with relayed media on UDP 49160-49400.
# The secret reaches both as a file, not as an environment variable, which docker inspect would show.
# Both use the VPS's own network (host networking): members keep their real addresses, IPv6 included, which Docker's
# port publishing would hide behind its own.
secrets:
  relay_secret:
    file: ./secret

services:
  ppn-relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    secrets:
      - relay_secret
    environment:
      PPN_RELAY_RATE_KBPS: ${PPN_RELAY_RATE_KBPS:-8000}
    network_mode: host  # listens on UDP 3479 and TCP 443, IPv6 and IPv4
    volumes:
      - ppn-relay-data:/data
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host  # TURN hands out relay ports from a range; host networking avoids publishing each one
    secrets:
      - relay_secret
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?set PUBLIC_IP in .env}
      PUBLIC_IP6: ${PUBLIC_IP6:-}
    volumes:
      - ./turnserver.conf:/etc/coturn/ppn-turnserver.conf:ro
    tmpfs:
      - /tmp
    # The secret goes into a copy of the configuration in memory, not on the command line, where ps would show it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        { cat /etc/coturn/ppn-turnserver.conf
          echo "static-auth-secret=$$(head -n 1 /run/secrets/relay_secret)"
          echo "external-ip=$$PUBLIC_IP"
          echo "allowed-peer-ip=$$PUBLIC_IP"
          if [ -n "$$PUBLIC_IP6" ]; then echo "allowed-peer-ip=$$PUBLIC_IP6"; fi; } > /tmp/turnserver.conf
        exec turnserver -c /tmp/turnserver.conf

volumes:
  ppn-relay-data:
