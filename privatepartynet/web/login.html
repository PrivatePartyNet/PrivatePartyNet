<!doctype html>
<html lang="en" data-theme="{{theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrivatePartyNet</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/ui.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: var(--sp-5); text-align: center; }
  .card { max-width: 440px; justify-items: center; }
  .mark { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg, #3d86ff, #2145c9); color: #ffffff; }
  .mark .ic { width: 28px; height: 28px; }
</style>
</head>
<body>
<div class="card">
  <span class="mark"><svg class="ic"><use href="#i-hat"></use></svg></span>
  <h1 style="font-size: var(--fs-xl)">Open this party from the app</h1>
  <p class="muted">Open this party from the PrivatePartyNet app. Ask the host to let you in from your PrivatePartyNet window.</p>
</div>
<script src="/static/icons.js"></script>
</body>
</html>
